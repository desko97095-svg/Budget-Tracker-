@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
.bt{--paper:#EEF1EC;--surface:#F9FBF8;--ink:#17302A;--muted:#5B6B65;--line:#D4DBD5;--brass:#C9A04A;--spend:#A8432F;--earn:#2E7555;
--ease:cubic-bezier(.25,.8,.25,1);--glide:cubic-bezier(.3,.7,.2,1);
font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.bt *{box-sizing:border-box}
.bt :focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* every interactive element eases between states */
.bt button,.bt .input,.bt .limit-input,.bt select{transition:background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease),opacity .25s var(--ease),transform .18s var(--ease)}
.bt button:active{transform:scale(.97)}
.bt .tx:active{transform:none}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes sheetOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(20px)}}
@keyframes freshIn{0%{opacity:0;background-color:rgba(201,160,74,.26)}25%{opacity:1;background-color:rgba(201,160,74,.26)}100%{opacity:1;background-color:rgba(201,160,74,0)}}
@keyframes toastLife{0%{opacity:0;transform:translate(-50%,10px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-4px)}}
.pop{animation:fadeIn .25s var(--ease)}
.rise{animation:fadeUp .3s var(--ease)}

.wrap{max-width:560px;margin:0 auto;animation:fadeIn .45s var(--ease);
padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.view{transition:opacity ${Eo}ms var(--ease),transform ${Eo+60}ms var(--ease)}
.view.leaving{opacity:0;transform:translateY(6px)}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:800;letter-spacing:-0.02em;margin:0}
.title svg{flex:none}
.monthnav{display:flex;align-items:center;gap:4px;transition:opacity .25s var(--ease),visibility .25s}
.monthnav.hidden{opacity:0;visibility:hidden}
.monthnav span{min-width:136px;text-align:center;font-weight:700;font-size:15px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}
.iconbtn:hover{border-color:var(--ink)}

/* segmented controls with a gliding indicator */
.tabs,.seg{position:relative;display:flex;background:#E2E8E3;border-radius:12px;padding:4px}
.tabs{margin:16px 0 18px}
.seg{margin-bottom:18px}
.tabs button,.seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font:inherit;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.ind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:9px;transition:transform .34s var(--glide),background-color .34s var(--ease)}
.tabs .ind{width:calc((100% - 8px) / 3);background:var(--surface);box-shadow:0 1px 2px rgba(23,48,42,.14)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.seg .ind{width:calc(50% - 4px);background:var(--spend)}
.seg[data-type="income"] .ind{background:var(--earn)}
.seg button[aria-pressed="true"]{color:#fff}

.hero{position:relative;overflow:hidden;background:var(--ink);color:#EAF1EC;border-radius:18px;padding:22px 20px 18px}
.guilloche{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.guilloche path{fill:none;stroke:rgba(201,160,74,.17);stroke-width:.7}
.hero>*:not(.guilloche){position:relative}
.hero-label{font-size:14px;color:#B9CBC2;margin:0}
.hero-num{font-size:44px;font-weight:800;letter-spacing:-0.03em;line-height:1.05;margin:6px 0 14px;word-break:break-word;transition:color .4s var(--ease)}
.hero-num.neg{color:#F2A28F}
.hero-bar{height:10px;border-radius:5px;background:rgba(255,255,255,.13);overflow:hidden}
.hero-bar div{height:100%;background:var(--brass);border-radius:5px;transform-origin:left;transition:width .6s var(--glide),background-color .4s var(--ease);animation:grow .8s var(--glide)}
.hero-bar div.over{background:#E0705A}
.hero-meta{font-size:13.5px;color:#B9CBC2;margin:10px 0 0;line-height:1.5}
.hero-split{display:flex;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.13)}
.hero-split div{flex:1}
.hero-split small{display:block;font-size:12.5px;color:#9FB4AA;margin-bottom:2px}
.hero-split strong{font-size:17px;font-weight:700}
.linkbtn{background:none;border:0;color:var(--brass);font:inherit;font-weight:700;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:#E2BE6E}
.section{margin-top:28px}
.section h2{font-size:16px;font-weight:800;margin:0 0 4px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.55}
.env{padding:12px 0;border-bottom:1px solid var(--line)}
.env-top{display:flex;align-items:center;gap:10px;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.env-name{flex:1;font-weight:600;min-width:0}
.env-amt{font-weight:700;white-space:nowrap}
.env-amt small{color:var(--muted);font-weight:500;font-size:13px}
.bar{height:6px;background:#DDE4DE;border-radius:3px;margin:8px 0 6px 20px;overflow:hidden}
.bar div{height:100%;border-radius:3px;transform-origin:left;transition:width .6s var(--glide),background-color .4s var(--ease);animation:grow .8s var(--glide)}
.env-sub{font-size:12.5px;color:var(--muted);margin-left:20px;transition:color .3s var(--ease)}
.env-sub.over{color:var(--spend);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.day{margin-top:18px}
.day-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
.tx:hover{background-color:rgba(23,48,42,.04)}
.tx.fresh{animation:freshIn 1.6s var(--ease)}
.tx-main{flex:1;min-width:0}
.tx-cat{font-weight:600;font-size:15px}
.tx-note{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:700;font-size:15px;white-space:nowrap}
.tx-amt.in{color:var(--earn)}

/* rows fold away smoothly when removed */
.collapse{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows ${zi}ms var(--ease),opacity ${zi-60}ms var(--ease)}
.collapse.gone{grid-template-rows:0fr;opacity:0}
.collapse>.inner{overflow:hidden;min-height:0}

.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:14.5px;line-height:1.6}
.empty .btn{margin-top:12px}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--ink);color:#fff}
.btn:hover{background:#224239}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--spend);color:#fff}
.btn.danger:hover{background:#943927}
.btn.small{padding:9px 14px;font-size:14px;border-radius:10px}
.bt .fab{position:fixed;right:max(calc(16px + env(safe-area-inset-right)),calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:14px 20px 14px 16px;background:var(--brass);color:var(--ink);font:inherit;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(23,48,42,.28);cursor:pointer;z-index:20;transition:opacity .3s var(--ease),transform .3s var(--ease),box-shadow .25s var(--ease),background-color .25s var(--ease)}
.bt .fab:hover{background:#D4AC58;box-shadow:0 8px 22px rgba(23,48,42,.32)}
.bt .fab.hidden{opacity:0;transform:translateY(14px) scale(.96);pointer-events:none}
.overlay{position:fixed;inset:0;background:rgba(15,30,26,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fadeIn .26s var(--ease)}
.overlay.closing{animation:fadeOut ${Yn}ms var(--ease) forwards;pointer-events:none}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:sheetIn .34s var(--glide)}
.overlay.closing .sheet{animation:sheetOut ${Yn}ms var(--ease) forwards}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px;padding-bottom:22px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{margin:0;font-size:18px;font-weight:800}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:18px;transition:border-color .3s var(--ease)}
.amount:focus-within{border-color:var(--ink)}
.amount input{flex:1;border:0;background:transparent;font:inherit;font-size:36px;font-weight:800;color:var(--ink);outline:none;min-width:0;letter-spacing:-0.02em;padding:0}
.amount span{font-size:20px;font-weight:700;color:var(--muted)}
.field-label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;color:var(--ink)}
.input:focus{outline:none;border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-bottom:16px}
.error{color:var(--spend);font-size:13.5px;font-weight:700;margin:0 0 12px;animation:fadeUp .25s var(--ease)}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.limit-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.limit-row .lbl{flex:1;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;min-width:0}
.limit-input{width:132px;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px}
.limit-input:focus-within{border-color:var(--ink)}
.limit-input.invalid{border-color:var(--spend)}
.limit-input input{width:100%;border:0;outline:none;background:transparent;padding:9px 0;font:inherit;font-size:15px;text-align:right;color:var(--ink)}
.limit-input span{color:var(--muted);font-size:14px;margin-left:6px}
.total-row{display:flex;justify-content:space-between;padding:12px 0 0;font-weight:800}
.cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.cat-row.fresh{animation:freshIn 1.6s var(--ease)}
.cat-row .name{flex:1;font-weight:600;min-width:0}
.meta{font-size:12.5px;color:var(--muted)}
.add-cat{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:12px}
.add-cat select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 10px;font:inherit;font-size:14px;color:var(--ink)}
.toast{position:fixed;left:50%;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 6px 18px rgba(23,48,42,.25);animation:toastLife 2.6s var(--ease) forwards;pointer-events:none}
.warn{background:#F6E3DE;color:var(--spend);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:14px;animation:fadeUp .3s var(--ease)}
@media (max-width:380px){.hero-num{font-size:36px}.monthnav span{min-width:112px;font-size:14px}}
.bt.still *,.bt.still *::before,.bt.still *::after{animation-duration:1ms !important;transition-duration:1ms !important}
